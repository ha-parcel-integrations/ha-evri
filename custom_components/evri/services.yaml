track_parcel:
  fields:
    tracking_code:
      required: true
      example: "H00AAA0000000001"
      selector:
        text:
    postal_code:
      required: false
      example: "SW1A 1AA"
      selector:
        text:
    direction:
      required: false
      default: incoming
      selector:
        select:
          options:
            - incoming
            - outgoing

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "H00AAA0000000001"
      selector:
        text:
    postal_code:
      required: false
      example: "SW1A 1AA"
      selector:
        text:
